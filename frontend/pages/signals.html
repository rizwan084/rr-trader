<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RR Trader — Signals & Confidence</title><style>
:root{--bg:#05070b;--panel:#0b1119;--panel2:#0e1621;--line:#1b2735;--text:#edf3f8;--muted:#7f8c9c;--green:#25d98a;--red:#ff6174;--gold:#f2c14e;--blue:#4da3ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#123020,transparent 30%),var(--bg);color:var(--text);font:13px Inter,system-ui,sans-serif}.wrap{max-width:1500px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.head h1{margin:0;font-size:27px}.head p{margin:6px 0 0;color:var(--muted)}button{cursor:pointer;border:1px solid var(--line);background:#0b1119;color:var(--text);border-radius:9px;padding:9px 12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px}.label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px}.value{font-size:24px;font-weight:800;margin-top:7px}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.blue{color:var(--blue)}.muted{color:var(--muted)}.signal{margin-bottom:14px}.signalHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.symbol{font-size:22px;font-weight:900}.pill{padding:5px 8px;border-radius:99px;background:#0c2017;border:1px solid #254334;color:#73eaae;font-size:10px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.metric{background:#0a1119;border:1px solid var(--line);padding:11px;border-radius:9px}.metric b{display:block;margin-top:5px}.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.rule{background:#091019;border:1px solid var(--line);border-radius:9px;padding:10px}.rule b{display:block;font-size:11px}.rule span{display:block;margin-top:5px;font-size:10px;color:var(--muted);line-height:1.35}.confirmed{border-color:#23543e}.weak{border-color:#55451d}.unavailable{opacity:.55}.bar{height:7px;background:#17222e;border-radius:10px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}.rules{grid-template-columns:repeat(3,1fr)}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.wrap{padding:13px}.grid,.rules,.metrics{grid-template-columns:1fr 1fr}.head{align-items:start;gap:10px}.head h1{font-size:22px}.rules{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><header class="head"><div><h1>RR Trader Signals</h1><p>Calibrated confidence: core confluence + market expansion + Advanced Rules 25–50.</p></div><button onclick="loadSignals()">Refresh</button></header><section class="grid"><div class="card"><div class="label">Core MTF</div><div class="value">15m / 1H / 4H</div></div><div class="card"><div class="label">Minimum Confidence</div><div class="value gold">85%</div></div><div class="card"><div class="label">Advanced Rules</div><div class="value blue">25–50</div></div><div class="card"><div class="label">Expansion Bonus</div><div class="value green">MAX +18</div></div><div class="card"><div class="label">Advanced Bonus</div><div class="value green">MAX +15</div></div></section><section id="signals"><div class="empty">Loading signals...</div></section></main><script>
const names={25:'EMA Structure / Slope',26:'RSI Regime',27:'MACD Confirmation',28:'ADX Trend Strength',29:'Volume Profile',30:'CVD Pressure',31:'Open Interest Change',32:'Funding Extreme',33:'Long/Short Ratio',34:'Whale Activity',35:'Order-Book Walls',36:'Spread / Slippage',37:'S/R Strength',38:'Supply / Demand',39:'Fair Value Gap',40:'Volume Imbalance',41:'Candle Quality',42:'Breakout Volume',43:'Fakeout Detection',44:'Liquidity Distance',45:'Target Liquidity',46:'Correlation',47:'Sector Strength',48:'Market Breadth',49:'Volatility Regime',50:'Setup Quality'};
function esc(v){return String(v??'—').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}function pct(v){const n=Number(v);return Number.isFinite(n)?n.toFixed(1)+'%':'—';}
function advancedBlock(a){if(!a||typeof a!=='object')return '<div class="card empty">Advanced confirmation data unavailable.</div>';const rules=a.rules&&typeof a.rules==='object'?a.rules:{};let h='<div class="card"><div class="signalHead"><div><div class="label">Advanced Confirmation Engine</div><div class="value blue">'+pct(a.score)+'</div></div><div style="text-align:right"><div class="label">Confirmed / Available</div><div class="value green">'+esc(a.confirmed_rules)+' / '+esc(a.available_rules)+'</div><div class="muted">Alignment '+pct(Number(a.confirmation_ratio||0)*100)+'</div></div></div><div class="bar"><i style="width:'+Math.min(100,Math.max(0,Number(a.score)||0))+'%"></i></div><div class="rules">';for(let n=25;n<=50;n++){const r=rules[String(n)]||{};const s=Number(r.score)||0;const st=String(r.status||'UNAVAILABLE').toLowerCase();h+='<div class="rule '+st+'"><b>'+n+'. '+esc(names[n]||r.name||'Rule')+'</b><span>'+esc(r.reason||r.status||'No evidence')+'</span><strong>'+pct(s)+'</strong></div>';}return h+'</div></div>';}
function render(signals){const box=document.getElementById('signals');if(!signals.length){box.innerHTML='<div class="card empty">No confirmed signals available.</div>';return;}box.innerHTML='';signals.forEach(s=>{const symbol=String(s.symbol||'UNKNOWN').toUpperCase(),dir=String(s.direction||'NEUTRAL').toUpperCase(),conf=Number(s.confidence)||0,adv=s.advanced_confirmations||s.advanced||{},f=s.factors||{},c=document.createElement('article');c.className='signal card';c.innerHTML='<div class="signalHead"><div><div class="symbol">'+esc(symbol)+'</div><div class="muted">'+esc(dir)+' • Calibrated confidence '+pct(conf)+'</div></div><span class="pill">'+esc(s.decision||'SIGNAL')+'</span></div><div class="metrics"><div class="metric"><span class="label">Entry</span><b>'+esc(s.entry??'—')+'</b></div><div class="metric"><span class="label">Stop Loss</span><b class="red">'+esc(s.stop_loss??'—')+'</b></div><div class="metric"><span class="label">TP1 / TP2 / TP3</span><b>'+esc(s.tp1??'—')+' / '+esc(s.tp2??'—')+' / '+esc(s.tp3??'—')+'</b></div><div class="metric"><span class="label">R:R</span><b class="gold">'+esc(s.risk_reward??'—')+'</b></div><div class="metric"><span class="label">Base Score</span><b class="blue">'+esc(s.base_confidence??'—')+'</b></div><div class="metric"><span class="label">Total Bonuses</span><b class="green">+'+((Number(s.market_expansion_bonus)||0)+(Number(s.advanced_bonus)||0)).toFixed(2)+'</b></div></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><div class="label">Core Factor Snapshot</div><div class="muted" style="margin-top:8px;line-height:1.8">Trend '+pct(f.trend)+' • Structure '+pct(f.structure)+' • Momentum '+pct(f.momentum)+'<br>Volume '+pct(f.volume)+' • S/R '+pct(f.support_resistance)+' • MTF '+pct(f.multi_timeframe)+'<br>Liquidity '+pct(f.liquidity)+' • Derivatives '+pct(f.derivatives)+' • R:R '+pct(f.risk_reward)+'<br>Regime '+pct(f.market_regime)+'</div><div class="muted" style="margin-top:10px">Expansion +'+esc(s.market_expansion_bonus??0)+' • Advanced +'+esc(s.advanced_bonus??0)+' • Conflict −'+esc(s.conflict_penalty??0)+'</div></div>'+advancedBlock(adv)+'</div>';box.appendChild(c);});}
async function loadSignals(){const box=document.getElementById('signals');box.innerHTML='<div class="card empty">Loading signals...</div>';try{const r=await fetch('/api/signals');const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Unable to load signals');render(Array.isArray(d.signals)?d.signals:[]);}catch(e){box.innerHTML='<div class="card empty">Backend unavailable: '+esc(e.message)+'</div>';}}loadSignals();setInterval(loadSignals,30000);
</script></body></html>
