<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        RR Trader — History / Analytics
    </title>

</head>


<body>

    <main>

        <header>

            <h1>
                History / Analytics
            </h1>

            <p>
                Review paper-trading performance,
                signals and risk statistics.
            </p>

        </header>


        <section>

            <h2>
                Performance Overview
            </h2>


            <div id="overview">

                Loading analytics...

            </div>

        </section>


        <section>

            <h2>
                Trade History
            </h2>


            <div id="history">

                Loading history...

            </div>

        </section>


        <section>

            <h2>
                Signal Statistics
            </h2>


            <div id="signals">

                Loading signal statistics...

            </div>

        </section>

    </main>


    <script>

        // =====================================================
        // LOAD TRADE HISTORY
        // =====================================================

        async function loadHistory() {

            const container =
                document.getElementById(
                    "history"
                );


            try {

                const response =
                    await fetch(
                        "/api/trade/history"
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    container.textContent =
                        "Unable to load trade history.";

                    return;

                }


                const trades =
                    Array.isArray(
                        data.trades
                    )
                        ? data.trades
                        : [];


                if (
                    trades.length === 0
                ) {

                    container.textContent =
                        "No closed trades yet.";

                    updateOverview(
                        []
                    );

                    return;

                }


                container.innerHTML =
                    "";


                trades.forEach(
                    function (trade) {

                        const card =
                            document.createElement(
                                "article"
                            );


                        const symbol =
                            String(
                                trade.symbol
                                || "UNKNOWN"
                            ).toUpperCase();


                        const direction =
                            String(
                                trade.direction
                                || "NEUTRAL"
                            ).toUpperCase();


                        const pnlPercent =
                            Number(
                                trade.pnl_percent
                                || 0
                            );


                        card.innerHTML = `

                            <h3>
                                ${symbol}
                            </h3>

                            <p>
                                Direction:
                                <strong>
                                    ${direction}
                                </strong>
                            </p>

                            <p>
                                Entry:
                                ${
                                    trade.entry
                                    ?? "-"
                                }
                            </p>

                            <p>
                                Exit:
                                ${
                                    trade.exit_price
                                    ?? "-"
                                }
                            </p>

                            <p>
                                PnL:
                                <strong>
                                    ${pnlPercent.toFixed(2)}%
                                </strong>
                            </p>

                            <p>
                                Result:
                                ${
                                    trade.result
                                    || "CLOSED"
                                }
                            </p>

                            <p>
                                Close Reason:
                                ${
                                    trade.close_reason
                                    || "-"
                                }
                            </p>

                        `;


                        container.appendChild(
                            card
                        );

                    }
                );


                updateOverview(
                    trades
                );

            } catch (error) {

                container.textContent =
                    "Backend unavailable.";

            }

        }


        // =====================================================
        // OVERVIEW
        // =====================================================

        function updateOverview(
            trades
        ) {

            const container =
                document.getElementById(
                    "overview"
                );


            if (
                !Array.isArray(
                    trades
                )
            ) {

                trades = [];

            }


            const total =
                trades.length;


            let wins = 0;
            let losses = 0;
            let totalPnl = 0;


            trades.forEach(
                function (trade) {

                    const pnl =
                        Number(
                            trade.pnl_percent
                            || 0
                        );


                    totalPnl += pnl;


                    const result =
                        String(
                            trade.result
                            || ""
                        ).toUpperCase();


                    if (
                        result === "WIN"
                        || pnl > 0
                    ) {

                        wins += 1;

                    } else if (
                        result === "LOSS"
                        || pnl < 0
                    ) {

                        losses += 1;

                    }

                }
            );


            const winRate =
                total > 0
                    ? (
                        wins
                        / total
                        * 100
                    )
                    : 0;


            container.innerHTML = `

                <div>

                    <strong>
                        Total Trades
                    </strong>

                    <p>
                        ${total}
                    </p>

                </div>


                <div>

                    <strong>
                        Wins
                    </strong>

                    <p>
                        ${wins}
                    </p>

                </div>


                <div>

                    <strong>
                        Losses
                    </strong>

                    <p>
                        ${losses}
                    </p>

                </div>


                <div>

                    <strong>
                        Win Rate
                    </strong>

                    <p>
                        ${winRate.toFixed(2)}%
                    </p>

                </div>


                <div>

                    <strong>
                        Total PnL
                    </strong>

                    <p>
                        ${totalPnl.toFixed(2)}%
                    </p>

                </div>

            `;

        }


        // =====================================================
        // SIGNAL STATISTICS
        // =====================================================

        async function loadSignals() {

            const container =
                document.getElementById(
                    "signals"
                );


            try {

                const response =
                    await fetch(
                        "/api/signals"
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    container.textContent =
                        "Unable to load signal statistics.";

                    return;

                }


                const signals =
                    Array.isArray(
                        data.signals
                    )
                        ? data.signals
                        : [];


                let longCount = 0;
                let shortCount = 0;
                let totalConfidence = 0;


                signals.forEach(
                    function (signal) {

                        const direction =
                            String(
                                signal.direction
                                || ""
                            ).toUpperCase();


                        if (
                            direction === "LONG"
                        ) {

                            longCount += 1;

                        }


                        if (
                            direction === "SHORT"
                        ) {

                            shortCount += 1;

                        }


                        totalConfidence +=
                            Number(
                                signal.confidence
                                || 0
                            );

                    }
                );


                const averageConfidence =
                    signals.length > 0
                        ? (
                            totalConfidence
                            / signals.length
                        )
                        : 0;


                container.innerHTML = `

                    <div>

                        <strong>
                            Total Signals
                        </strong>

                        <p>
                            ${signals.length}
                        </p>

                    </div>


                    <div>

                        <strong>
                            LONG
                        </strong>

                        <p>
                            ${longCount}
                        </p>

                    </div>


                    <div>

                        <strong>
                            SHORT
                        </strong>

                        <p>
                            ${shortCount}
                        </p>

                    </div>


                    <div>

                        <strong>
                            Average Confidence
                        </strong>

                        <p>
                            ${averageConfidence.toFixed(2)}%
                        </p>

                    </div>

                `;

            } catch (error) {

                container.textContent =
                    "Backend unavailable.";

            }

        }


        // =====================================================
        // INITIAL LOAD
        // =====================================================

        loadHistory();
        loadSignals();

    </script>

</body>

</html>
