<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        RR Trader — AI Assistant
    </title>

</head>


<body>

    <main>

        <header>

            <h1>
                RR Trader AI Assistant
            </h1>

            <p>
                AI-powered market explanation and post generation.
            </p>

        </header>


        <section>

            <h2>
                AI Chat
            </h2>

            <textarea
                id="user-request"
                rows="6"
                cols="60"
                placeholder="Ask RR Trader AI anything..."
            ></textarea>

            <br>

            <button
                type="button"
                id="ask-ai"
            >
                Ask AI
            </button>

        </section>


        <section>

            <h2>
                AI Response
            </h2>

            <div id="ai-response">
                AI response will appear here.
            </div>

        </section>


        <section>

            <h2>
                Post to Generate
            </h2>

            <p>
                Generate a community trading post from
                a confirmed RR Trader signal.
            </p>

            <label for="post-symbol">
                Symbol
            </label>

            <input
                id="post-symbol"
                type="text"
                placeholder="BTCUSDT"
            >

            <br><br>

            <label for="post-direction">
                Direction
            </label>

            <select id="post-direction">

                <option value="LONG">
                    LONG
                </option>

                <option value="SHORT">
                    SHORT
                </option>

            </select>

            <br><br>

            <label for="post-confidence">
                Confidence
            </label>

            <input
                id="post-confidence"
                type="number"
                min="0"
                max="100"
                value="85"
            >

            <br><br>

            <label for="post-entry">
                Entry
            </label>

            <input
                id="post-entry"
                type="number"
                step="any"
            >

            <br><br>

            <label for="post-stop">
                Stop Loss
            </label>

            <input
                id="post-stop"
                type="number"
                step="any"
            >

            <br><br>

            <label for="post-tp1">
                TP1
            </label>

            <input
                id="post-tp1"
                type="number"
                step="any"
            >

            <br><br>

            <label for="post-tp2">
                TP2
            </label>

            <input
                id="post-tp2"
                type="number"
                step="any"
            >

            <br><br>

            <label for="post-tp3">
                TP3
            </label>

            <input
                id="post-tp3"
                type="number"
                step="any"
            >

            <br><br>

            <button
                type="button"
                id="generate-post"
            >
                Generate Post
            </button>

        </section>


        <section>

            <h2>
                Generated Post
            </h2>

            <textarea
                id="generated-post"
                rows="12"
                cols="80"
                readonly
                placeholder="Generated Binance community post..."
            ></textarea>

            <br>

            <button
                type="button"
                id="copy-post"
            >
                Copy Post
            </button>

        </section>

    </main>


    <script>

        // =====================================================
        // AI CHAT
        // =====================================================

        async function askAI() {

            const request =
                document.getElementById(
                    "user-request"
                ).value.trim();

            const responseBox =
                document.getElementById(
                    "ai-response"
                );


            if (!request) {

                responseBox.textContent =
                    "Please enter your question.";

                return;

            }


            responseBox.textContent =
                "AI is thinking...";


            try {

                const response =
                    await fetch(
                        "/api/ai/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                message: request
                            })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    responseBox.textContent =
                        data.error
                        || "AI request failed.";

                    return;

                }


                responseBox.textContent =
                    data.answer
                    || data.response
                    || "AI returned no response.";

            } catch (error) {

                responseBox.textContent =
                    "AI backend unavailable.";

            }

        }


        // =====================================================
        // GENERATE POST
        // =====================================================

        async function generatePost() {

            const payload = {

                symbol:
                    document.getElementById(
                        "post-symbol"
                    ).value.trim().toUpperCase(),

                direction:
                    document.getElementById(
                        "post-direction"
                    ).value,

                confidence:
                    Number(
                        document.getElementById(
                            "post-confidence"
                        ).value
                    ),

                entry:
                    Number(
                        document.getElementById(
                            "post-entry"
                        ).value
                    ),

                stop_loss:
                    Number(
                        document.getElementById(
                            "post-stop"
                        ).value
                    ),

                tp1:
                    Number(
                        document.getElementById(
                            "post-tp1"
                        ).value
                    ),

                tp2:
                    Number(
                        document.getElementById(
                            "post-tp2"
                        ).value
                    ),

                tp3:
                    Number(
                        document.getElementById(
                            "post-tp3"
                        ).value
                    )

            };


            const postBox =
                document.getElementById(
                    "generated-post"
                );


            if (
                !payload.symbol ||
                !payload.entry ||
                !payload.stop_loss ||
                !payload.tp1 ||
                !payload.tp2 ||
                !payload.tp3
            ) {

                postBox.value =
                    "Please provide symbol, entry, SL and all targets.";

                return;

            }


            postBox.value =
                "Generating post...";


            try {

                const response =
                    await fetch(
                        "/api/post/generate",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    payload
                                )
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    postBox.value =
                        data.error
                        || "Post generation failed.";

                    return;

                }


                postBox.value =
                    data.post
                    || data.content
                    || data.text
                    || "No post returned.";

            } catch (error) {

                postBox.value =
                    "Post generation backend unavailable.";

            }

        }


        // =====================================================
        // COPY POST
        // =====================================================

        async function copyPost() {

            const post =
                document.getElementById(
                    "generated-post"
                ).value;


            if (!post.trim()) {
                return;
            }


            try {

                await navigator.clipboard.writeText(
                    post
                );

                alert(
                    "Post copied."
                );

            } catch (error) {

                alert(
                    "Unable to copy post."
                );

            }

        }


        // =====================================================
        // EVENTS
        // =====================================================

        document
            .getElementById(
                "ask-ai"
            )
            .addEventListener(
                "click",
                askAI
            );


        document
            .getElementById(
                "generate-post"
            )
            .addEventListener(
                "click",
                generatePost
            );


        document
            .getElementById(
                "copy-post"
            )
            .addEventListener(
                "click",
                copyPost
            );

    </script>

</body>

</html>
