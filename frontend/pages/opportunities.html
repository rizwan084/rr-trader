<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        RR Trader — Trade Opportunities
    </title>

</head>


<body>

    <main>

        <header>

            <h1>
                Trade Opportunities
            </h1>

            <p>
                High-quality LONG and SHORT market setups.
            </p>

        </header>


        <section>

            <h2>
                Core Market Timeframes
            </h2>

            <div>

                <strong>
                    15m
                </strong>

                <p>
                    Entry timing, momentum and local structure.
                </p>

            </div>


            <div>

                <strong>
                    1H
                </strong>

                <p>
                    Main directional trend confirmation.
                </p>

            </div>


            <div>

                <strong>
                    4H
                </strong>

                <p>
                    Higher-timeframe market regime.
                </p>

            </div>

        </section>


        <section>

            <h2>
                Live Opportunities
            </h2>

            <div id="opportunities">

                Loading opportunities...

            </div>

        </section>

    </main>


    <script>

        async function loadOpportunities() {

            const container =
                document.getElementById(
                    "opportunities"
                );

            try {

                const response =
                    await fetch(
                        "/api/signals"
                    );

                const data =
                    await response.json();

                if (
                    !response.ok ||
                    !data.success
                ) {

                    container.textContent =
                        "Unable to load signals.";

                    return;

                }


                const signals =
                    Array.isArray(
                        data.signals
                    )
                        ? data.signals
                        : [];


                if (
                    signals.length === 0
                ) {

                    container.textContent =
                        "No confirmed trade opportunities yet.";

                    return;

                }


                container.innerHTML = "";


                signals.forEach(
                    function (signal) {

                        const card =
                            document.createElement(
                                "article"
                            );

                        const symbol =
                            String(
                                signal.symbol
                                || "UNKNOWN"
                            ).toUpperCase();

                        const direction =
                            String(
                                signal.direction
                                || "NEUTRAL"
                            ).toUpperCase();

                        const confidence =
                            Number(
                                signal.confidence
                                || 0
                            );


                        card.innerHTML = `
                            <h3>
                                ${symbol}
                            </h3>

                            <p>
                                Direction:
                                <strong>
                                    ${direction}
                                </strong>
                            </p>

                            <p>
                                Confidence:
                                <strong>
                                    ${confidence.toFixed(2)}%
                                </strong>
                            </p>
                        `;


                        container.appendChild(
                            card
                        );

                    }
                );

            } catch (error) {

                container.textContent =
                    "Backend unavailable.";

            }

        }


        loadOpportunities();

    </script>

</body>

</html>
