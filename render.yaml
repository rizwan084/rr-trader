services:
  - type: web
    name: rr-trader-1
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @quantedge/shared build && pnpm --filter @quantedge/market-data build && pnpm --filter @quantedge/signal-engine build && pnpm --filter @quantedge/api build
    startCommand: pnpm --filter @quantedge/api start
    healthCheckPath: /healthz
    autoDeploy: true
    healthCheckPath: /dashboard
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MIN_CONFIDENCE
        value: "85"
      - key: AUTO_SCAN_INTERVAL
        value: "60000"
      - key: AUTO_SCAN_COINS
        value: "6"
      - key: API_PORT
        value: "4000"
      - key: CRYPTO_BEP20_RECEIVE_ADDRESS
        value: "0x791715b994ba7D176af2630E8f655Ed037dc9999"
      - key: CRYPTO_USDT_CONTRACT
        value: "0x55d398326f99059fF775485246999027B3197955"
      - key: CRYPTO_BSC_RPC_URL
        value: "https://bsc-dataseed.binance.org"
      - key: CRYPTO_CONFIRMATIONS
        value: "12"
      - key: PRO_PRICE_USDT
        value: "29"
      - key: BASIC_PRICE_USDT
        value: "9"
      - key: FRONTEND_URL
        value: "https://rr-trader-dashboard.onrender.com"
  - type: web
    name: rr-trader-dashboard
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @quantedge/web build
    startCommand: pnpm --filter @quantedge/web start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: "https://rr-trader-1.onrender.com"
  - type: worker
    name: quantedge-scanner
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @quantedge/shared build && pnpm --filter @quantedge/market-data build && pnpm --filter @quantedge/signal-engine build
    startCommand: pnpm --filter @quantedge/api worker
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MIN_CONFIDENCE
        value: "85"
      - key: AUTO_SCAN_INTERVAL
        value: "60000"
      - key: AUTO_SCAN_COINS
        value: "6"
