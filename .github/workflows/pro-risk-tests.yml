name: RR Trader Pro Risk Tests

on:
  push:
    branches: ["main", "pro-risk-auto-trading"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Validate new pro-risk layer
        env:
          PYTHONPATH: backend
          TRADING_MODE: paper
          LIVE_TRADING_ENABLED: "false"
        run: pytest -q tests/test_pro_risk.py
