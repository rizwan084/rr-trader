services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantedge
      POSTGRES_USER: quantedge
      POSTGRES_PASSWORD: quantedge
    ports: ["5432:5432"]
    volumes: [quantedge_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["6379:6379"]
volumes:
  quantedge_pg:
